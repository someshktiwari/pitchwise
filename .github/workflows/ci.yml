name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Offline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.13
      - name: Install dependencies
        run: uv sync --frozen
      # Tests use a scripted fake LLM and a fake vector store:
      # no API keys, no network calls, no embedding model download.
      - name: Run tests
        run: uv run pytest tests/ -q
